# XcodeGen project definition for the Oralia iOS app.
# Generate the Xcode project on a Mac with:
#   brew install xcodegen
#   cd apps/ios && xcodegen generate
# Then open Oralia.xcodeproj in Xcode 15+ and run on iOS 17+.
name: Oralia
options:
  bundleIdPrefix: com.oralia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Oralia:
    type: application
    platform: iOS
    sources:
      - path: Oralia
    info:
      path: Oralia/Info.plist
      properties:
        CFBundleDisplayName: Oralia
        UILaunchScreen: {}
        NSAppTransportSecurity:
          # Allows plain-HTTP connections to a local dev API server.
          # Remove for production builds pointing at an HTTPS host.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oralia.app
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
